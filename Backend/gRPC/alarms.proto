    syntax='proto3'

    service alarmsService {
        rpc sendAlarms(alarmsRequest) return (alarmsResponse)
    }

    message alarmsRequest{
        int32 id=1,
        string node_name =2,
        string    alarm_type= 3,
        string   severity= 4,
        string   message =5
        string   status =6,
        google.protobuf.Timestamp   created_at =7
    }

    message alarmsResponse{
       string status=1,
       int32 status_code=2
    }